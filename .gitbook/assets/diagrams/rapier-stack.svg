<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-label="Where Rapier sits, in Unity and in a console server">
  <title>Where Rapier sits, in Unity and in a console server</title>
  <defs><marker id="arrow-4B5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker></defs>
  <rect x="0.5" y="0.5" width="919" height="399" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="30.0" y="38.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Unity client or server</text>
  <rect x="30.0" y="56.0" width="400.0" height="58.0" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="230.0" y="81.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Game code</text>
  <text x="230.0" y="98.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">apply, capture, restore, OnTick</text>
  <rect x="30.0" y="132.0" width="400.0" height="58.0" rx="10" fill="#E6F6EF" stroke="#0E9F6E" stroke-width="1.5"/>
  <text x="230.0" y="157.2" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">PhysicsBody, PhysicsBody2D</text>
  <text x="230.0" y="174.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">unchanged</text>
  <path d="M 230.0 114.0 L 230.0 132.0" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4B5563)"/>
  <rect x="30.0" y="208.0" width="400.0" height="58.0" rx="10" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="230.0" y="233.2" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#4C1D95" text-anchor="middle">RapierPhysics</text>
  <text x="230.0" y="250.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">one world per network scene and dimension</text>
  <path d="M 230.0 190.0 L 230.0 208.0" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4B5563)"/>
  <text x="490.0" y="38.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Console server, without Unity</text>
  <rect x="490.0" y="56.0" width="400.0" height="58.0" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="690.0" y="81.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Your console program</text>
  <text x="690.0" y="98.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">EntityBehaviour classes, the same models</text>
  <rect x="490.0" y="208.0" width="400.0" height="58.0" rx="10" fill="#F1EAFE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="690.0" y="233.2" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#4C1D95" text-anchor="middle">RapierScenes</text>
  <text x="690.0" y="250.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">the same worlds, built from the same scene file</text>
  <path d="M 690.0 114.0 L 690.0 208.0" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4B5563)"/>
  <rect x="30.0" y="300.0" width="860.0" height="64.0" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="460.0" y="328.2" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">fomoxa_rapier</text>
  <text x="460.0" y="345.6" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">rapier3d, rapier2d 0.36.0, enhanced-determinism</text>
  <path d="M 230.0 266.0 L 230.0 300.0" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4B5563)"/>
  <path d="M 690.0 266.0 L 690.0 300.0" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4B5563)"/>
  <text x="30.0" y="388.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">A snapshot holds the whole Rapier world, contacts included, so a replay gives the same ticks as the first run.</text>
</svg>
