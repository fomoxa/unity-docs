<svg xmlns="http://www.w3.org/2000/svg" width="920" height="602" viewBox="0 0 920 602" role="img" aria-label="The order of work in one tick">
  <title>The order of work in one tick</title>
  <defs></defs>
  <rect x="0.5" y="0.5" width="919" height="601" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="390.0" y="50.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0E9F6E" text-anchor="middle">Client</text>
  <text x="730.0" y="50.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2F6FEB" text-anchor="middle">Server</text>
  <rect x="230.0" y="62.0" width="320.0" height="470.0" rx="10" fill="#F7FCF9" stroke="#D1FAE5" stroke-width="1.5"/>
  <rect x="570.0" y="62.0" width="320.0" height="470.0" rx="10" fill="#F6F9FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <circle cx="34.0" cy="93.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="97.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="56.0" y="98.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">OnPreTick</text>
  <rect x="240.0" y="80.0" width="640.0" height="28.0" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="560.0" y="98.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">TimeManager.Tick increases, OnPreTick fires</text>
  <circle cx="34.0" cy="135.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="139.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="56.0" y="140.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Receive</text>
  <rect x="240.0" y="122.0" width="640.0" height="28.0" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="560.0" y="140.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">first tick of the frame only; the client updates its clock</text>
  <circle cx="34.0" cy="177.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="181.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="56.0" y="182.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Place bodies</text>
  <rect x="240.0" y="164.0" width="300.0" height="28.0" rx="6" fill="#E6F6EF" stroke="#0E9F6E" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="390.0" y="182.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#065F46" text-anchor="middle">bodies it does not predict follow their transforms</text>
  <circle cx="34.0" cy="219.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="223.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="56.0" y="224.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Predict</text>
  <rect x="240.0" y="206.0" width="300.0" height="28.0" rx="6" fill="#E6F6EF" stroke="#0E9F6E" stroke-width="1.2"/>
  <text x="390.0" y="224.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#065F46" text-anchor="middle">reconcile, then gather, apply and send input</text>
  <circle cx="34.0" cy="261.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="265.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="56.0" y="266.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Apply input</text>
  <rect x="580.0" y="248.0" width="300.0" height="28.0" rx="6" fill="#E8F0FE" stroke="#2F6FEB" stroke-width="1.2"/>
  <text x="730.0" y="266.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1E3A8A" text-anchor="middle">input of this tick for every object</text>
  <circle cx="34.0" cy="303.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="307.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="56.0" y="308.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Step physics</text>
  <rect x="240.0" y="290.0" width="640.0" height="28.0" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="560.0" y="308.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">one step, then query contacts</text>
  <circle cx="34.0" cy="345.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="349.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="56.0" y="350.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Record</text>
  <rect x="240.0" y="332.0" width="300.0" height="28.0" rx="6" fill="#E6F6EF" stroke="#0E9F6E" stroke-width="1.2"/>
  <text x="390.0" y="350.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#065F46" text-anchor="middle">record the predicted state</text>
  <rect x="580.0" y="332.0" width="300.0" height="28.0" rx="6" fill="#E8F0FE" stroke="#2F6FEB" stroke-width="1.2"/>
  <text x="730.0" y="350.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1E3A8A" text-anchor="middle">send reconcile states to owners</text>
  <circle cx="34.0" cy="387.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="391.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="56.0" y="392.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Contact events</text>
  <rect x="240.0" y="374.0" width="640.0" height="28.0" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="560.0" y="392.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">enter, stay and exit callbacks</text>
  <circle cx="34.0" cy="429.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="433.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
  <text x="56.0" y="434.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">OnTick, OnPostTick</text>
  <rect x="240.0" y="416.0" width="640.0" height="28.0" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="560.0" y="434.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">your per-tick game logic</text>
  <circle cx="34.0" cy="471.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="475.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
  <text x="56.0" y="476.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Capture</text>
  <rect x="580.0" y="458.0" width="300.0" height="28.0" rx="6" fill="#E8F0FE" stroke="#2F6FEB" stroke-width="1.2"/>
  <text x="730.0" y="476.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1E3A8A" text-anchor="middle">observers, state and transforms are queued</text>
  <circle cx="34.0" cy="513.0" r="12" fill="#4B5563"/>
  <text x="34.0" y="517.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text>
  <text x="56.0" y="518.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Flush</text>
  <rect x="240.0" y="500.0" width="640.0" height="28.0" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="560.0" y="518.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">both send queues are sent</text>
  <rect x="30.0" y="558.0" width="34.0" height="18.0" rx="5" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="74.0" y="572.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">only with physics simulation on</text>
  <rect x="330.0" y="558.0" width="34.0" height="18.0" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="374.0" y="572.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">on both sides, wherever the manager runs a server or a client</text>
</svg>
