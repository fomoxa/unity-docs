<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-label="A server that takes desktop and browser clients">
  <title>A server that takes desktop and browser clients</title>
  <defs><marker id="arrow-0E9F6E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E9F6E"/></marker><marker id="arrow-D97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="919" height="329" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="30.0" y="50.0" width="210.0" height="64.0" rx="10" fill="#E6F6EF" stroke="#0E9F6E" stroke-width="1.5"/>
  <text x="135.0" y="78.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Desktop client</text>
  <text x="135.0" y="95.6" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#065F46" text-anchor="middle">UdpNetworkTransport</text>
  <rect x="30.0" y="196.0" width="210.0" height="64.0" rx="10" fill="#E6F6EF" stroke="#0E9F6E" stroke-width="1.5"/>
  <text x="135.0" y="224.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Browser client</text>
  <text x="135.0" y="241.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">page served over HTTPS</text>
  <rect x="340.0" y="196.0" width="200.0" height="64.0" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="440.0" y="224.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#78350F" text-anchor="middle">Reverse proxy</text>
  <text x="440.0" y="241.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">terminates TLS</text>
  <rect x="640.0" y="30.0" width="250.0" height="250.0" rx="14" fill="#E8F0FE" stroke="#2F6FEB" stroke-width="1.5"/>
  <text x="660.0" y="56.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="start">Server host</text>
  <rect x="660.0" y="70.0" width="210.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="765.0" y="96.2" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">UDP :7777</text>
  <text x="765.0" y="113.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">entry 0, StartConnection port</text>
  <rect x="660.0" y="196.0" width="210.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="765.0" y="222.2" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">ws:// :8080/play</text>
  <text x="765.0" y="239.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">entry 1, Path /play</text>
  <path d="M 240.0 82.0 L 660.0 100.0" fill="none" stroke="#0E9F6E" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-0E9F6E)" marker-start="url(#arrow-0E9F6E)"/>
  <rect x="380.6" y="71.5" width="138.9" height="16.5" rx="3" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="450.0" y="83.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#0E9F6E" text-anchor="middle">UDP, open inbound 7777</text>
  <path d="M 240.0 228.0 L 340.0 228.0" fill="none" stroke="#0E9F6E" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-0E9F6E)" marker-start="url(#arrow-0E9F6E)"/>
  <rect x="265.3" y="208.5" width="49.4" height="16.5" rx="3" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="290.0" y="220.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E9F6E" text-anchor="middle">wss://</text>
  <path d="M 540.0 228.0 L 660.0 226.0" fill="none" stroke="#D97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-D97706)" marker-start="url(#arrow-D97706)"/>
  <rect x="578.8" y="207.5" width="42.5" height="16.5" rx="3" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="600.0" y="219.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="11.5" font-weight="500" fill="#D97706" text-anchor="middle">ws://</text>
  <text x="30.0" y="300.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Clients reach the server over IPv4. Allowed Origins on the server lists the origins that serve the page.</text>
  <text x="30.0" y="318.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Server and clients must be built from the same models, prefabs and scenes.</text>
</svg>
